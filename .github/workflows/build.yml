name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build AppDump.ipa
        run: bash ci/build_ipa_macos.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppDump-ipa
          path: dist/*.ipa
          if-no-files-found: error